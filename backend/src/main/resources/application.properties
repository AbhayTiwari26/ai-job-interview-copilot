# ─── Server ────────────────────────────────────────────────────────────────────
server.port=${SERVER_PORT:8081}

# ─── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ─── File Upload ───────────────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ─── JWT ───────────────────────────────────────────────────────────────────────
# IMPORTANT: Change this secret in production! Must be at least 32 characters.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# ─── Spring AI (Gemini via OpenAI-compatible API) ─────────────────────────────
# Get your API key from: https://aistudio.google.com → Get API Key
# Key format should be: AIzaSyXXXXXXXXXXXXXX
spring.ai.openai.api-key=${GEMINI_API_KEY}
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.chat.options.model=gemini-2.0-flash
spring.ai.openai.embedding.enabled=false

# ─── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.example.copilot=INFO
logging.level.org.springframework.security=WARN
